<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Management — MC Store Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ── matches MC Store admin colour palette ── */
    :root {
      --blue:      #1a56db;
      --blue-dark: #1543ad;
      --blue-lt:   rgba(26,86,219,.08);
      --blue-bd:   rgba(26,86,219,.20);
      --gold:      #f5a623;
      --gold2:     #f97316;
      --gold-lt:   rgba(245,166,35,.10);
      --gold-bd:   rgba(245,166,35,.28);
      --green:     #0ea968;
      --green-lt:  rgba(14,169,104,.10);
      --green-bd:  rgba(14,169,104,.28);
      --red:       #dc2626;
      --red-lt:    rgba(220,38,38,.08);
      --red-bd:    rgba(220,38,38,.22);
      --amber:     #f59e0b;
      --amber-lt:  rgba(245,158,11,.10);
      --amber-bd:  rgba(245,158,11,.28);
      --bg:        #f6f8fd;
      --surface:   #ffffff;
      --border:    rgba(26,86,219,.10);
      --ink:       #0f1b3d;
      --muted:     #5b6987;
      --muted2:    #93a0bd;
      --font:      'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; background: none; }
    img { display: block; max-width: 100%; }

    /* PAGE */
    .page { padding: 16px; max-width: 960px; margin: 0 auto; }

    /* STATS ROW */
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    @media(min-width:600px){ .stats-row { grid-template-columns: repeat(4,1fr); } }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px;
      box-shadow: 0 2px 10px rgba(15,27,61,.05);
    }
    .stat-card .s-num { font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 3px; }
    .stat-card .s-label { font-size: 11px; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: .06em; }
    .stat-card.pending .s-num { color: var(--amber); }
    .stat-card.approved .s-num { color: var(--green); }
    .stat-card.rejected .s-num { color: var(--red); }
    .stat-card.total .s-num { color: var(--blue); }

    /* TOOLBAR */
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .search-box {
      flex: 1; min-width: 180px;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 9px 12px;
    }
    .search-box i { font-size: 13px; color: var(--muted2); flex-shrink: 0; }
    .search-box input { background: none; border: none; outline: none; font-size: 13px; color: var(--ink); width: 100%; font-family: var(--font); }
    .search-box input::placeholder { color: var(--muted2); }

    .filter-select {
      padding: 9px 12px; border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface); font-size: 13px; font-weight: 600;
      color: var(--ink); outline: none; cursor: pointer;
      font-family: var(--font);
    }

    .btn-refresh {
      padding: 9px 14px; border-radius: 10px;
      background: var(--blue-lt); border: 1px solid var(--blue-bd);
      color: var(--blue); font-size: 13px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
      transition: background .2s;
    }
    .btn-refresh:hover { background: var(--blue-bd); }

    /* VENDOR LIST */
    .vendor-list { display: flex; flex-direction: column; gap: 10px; }

    .vendor-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 10px rgba(15,27,61,.05);
      transition: border-color .2s;
    }
    .vendor-card:hover { border-color: var(--blue-bd); }
    .vendor-card.status-pending  { border-left: 4px solid var(--amber); }
    .vendor-card.status-approved { border-left: 4px solid var(--green); }
    .vendor-card.status-rejected { border-left: 4px solid var(--red); }
    .vendor-card.status-draft    { border-left: 4px solid var(--muted2); }

    .vc-top {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 14px 10px;
    }
    .vc-avatar {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 11px; overflow: hidden;
      background: var(--blue-lt); border: 1px solid var(--blue-bd);
      display: grid; place-items: center;
      font-size: 18px; font-weight: 900; color: var(--blue);
    }
    .vc-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .vc-info { flex: 1; min-width: 0; }
    .vc-name { font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vc-slug { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vc-status { flex-shrink: 0; }

    /* STATUS PILLS */
    .pill { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; }
    .pill-pending  { background: var(--amber-lt); color: var(--amber); border: 1px solid var(--amber-bd); }
    .pill-approved { background: var(--green-lt); color: var(--green); border: 1px solid var(--green-bd); }
    .pill-rejected { background: var(--red-lt); color: var(--red); border: 1px solid var(--red-bd); }
    .pill-draft    { background: var(--blue-lt); color: var(--muted); border: 1px solid var(--border); }

    /* VENDOR DETAILS */
    .vc-details {
      padding: 0 14px 10px;
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .vc-detail { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .vc-detail i { font-size: 11px; color: var(--muted2); flex-shrink: 0; }
    .vc-detail span { font-weight: 600; color: var(--ink); }

    /* EXPAND TOGGLE */
    .vc-toggle {
      width: 100%; padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; font-weight: 700; color: var(--muted);
      transition: background .15s, color .15s;
    }
    .vc-toggle:hover { background: var(--bg); color: var(--blue); }

    /* EXPANDED SECTION */
    .vc-expanded { display: none; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--bg); }
    .vc-expanded.show { display: block; }

    .vc-section-title { font-size: 11px; font-weight: 800; color: var(--muted2); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; margin-top: 12px; }
    .vc-section-title:first-child { margin-top: 0; }

    .vc-info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; margin-bottom: 4px; }
    .vc-info-item { font-size: 12px; }
    .vc-info-item .i-label { color: var(--muted2); font-weight: 600; font-size: 11px; margin-bottom: 1px; }
    .vc-info-item .i-val { color: var(--ink); font-weight: 700; word-break: break-word; }

    /* ID PHOTOS */
    .photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .photo-thumb {
      width: 80px; height: 80px; border-radius: 8px;
      object-fit: cover; border: 1px solid var(--border);
      cursor: pointer; transition: transform .2s;
    }
    .photo-thumb:hover { transform: scale(1.05); }
    .photo-label { font-size: 10px; font-weight: 700; color: var(--muted2); margin-top: 3px; text-align: center; }
    .photo-wrap { display: flex; flex-direction: column; align-items: center; }

    /* REJECTION REASON INPUT */
    .rejection-wrap { margin-bottom: 10px; }
    .rejection-wrap label { font-size: 12px; font-weight: 700; color: var(--ink); display: block; margin-bottom: 5px; }
    .rejection-wrap textarea {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 13px; color: var(--ink); background: var(--surface);
      font-family: var(--font); resize: vertical; min-height: 70px; outline: none;
      transition: border-color .2s;
    }
    .rejection-wrap textarea:focus { border-color: var(--red); }

    /* ACTION BUTTONS */
    .vc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-approve {
      flex: 1; padding: 11px; border-radius: 10px;
      font-size: 13px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--green), #059669);
      box-shadow: 0 4px 14px rgba(14,169,104,.25);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-approve:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(14,169,104,.35); }
    .btn-approve:disabled { opacity: .6; transform: none; cursor: not-allowed; }

    .btn-reject {
      flex: 1; padding: 11px; border-radius: 10px;
      font-size: 13px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--red), #b91c1c);
      box-shadow: 0 4px 14px rgba(220,38,38,.22);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-reject:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(220,38,38,.30); }
    .btn-reject:disabled { opacity: .6; transform: none; cursor: not-allowed; }

    .btn-view-shop {
      padding: 11px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 700; color: var(--blue);
      border: 1.5px solid var(--blue-bd); background: var(--blue-lt);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .2s;
    }
    .btn-view-shop:hover { background: var(--blue-bd); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      z-index: 999; background: var(--ink);
      color: #fff; border-radius: 10px; padding: 11px 18px;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.3);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success i { color: var(--green); }
    .toast.error i { color: var(--red); }

    /* EMPTY */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty i { font-size: 40px; color: var(--muted2); margin-bottom: 12px; }
    .empty h3 { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
    .empty p { font-size: 13px; }

    /* LOADING */
    .loading { text-align: center; padding: 48px 20px; }
    .spin { width: 36px; height: 36px; border: 3px solid var(--blue-lt); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    .loading p { font-size: 13px; color: var(--muted); font-weight: 600; }

    /* IMAGE LIGHTBOX */
    .lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.85); display: none; place-items: center; }
    .lightbox.show { display: grid; }
    .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 10px; object-fit: contain; }
    .lightbox-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; background: rgba(255,255,255,.15); border-radius: 8px; display: grid; place-items: center; font-size: 16px; color: #fff; cursor: pointer; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="page">

  <!-- STATS -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card pending"><div class="s-num" id="stat-pending">—</div><div class="s-label">Pending</div></div>
    <div class="stat-card approved"><div class="s-num" id="stat-approved">—</div><div class="s-label">Approved</div></div>
    <div class="stat-card rejected"><div class="s-num" id="stat-rejected">—</div><div class="s-label">Rejected</div></div>
    <div class="stat-card total"><div class="s-num" id="stat-total">—</div><div class="s-label">Total</div></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search by name, email, slug..." oninput="applyFilters()" />
    </div>
    <select class="filter-select" id="status-filter" onchange="applyFilters()">
      <option value="all">All statuses</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
      <option value="draft">Draft</option>
    </select>
    <button class="btn-refresh" onclick="loadVendors()">
      <i class="fa-solid fa-rotate-right"></i> Refresh
    </button>
  </div>

  <!-- VENDOR LIST -->
  <div id="vendor-list" class="vendor-list">
    <div class="loading">
      <div class="spin"></div>
      <p>Loading vendors...</p>
    </div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></div>
  <img id="lightbox-img" src="" alt="ID Document" />
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toast-msg">Done</span>
</div>

<script>
  const SB_URL  = "https://kswikkoqfpyxuurzxail.supabase.co";
  const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzd2lra29xZnB5eHV1cnp4YWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNjEzMDQsImV4cCI6MjA4NjkzNzMwNH0.uuoSKWOTeXot1HJys0EO9OcIRBL0mKrNHIUHIAPCpZ4";

  let allVendors = [];

  async function sb(path, method = 'GET', body = null, extra = {}) {
    const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
      method,
      headers: {
        'apikey':        SB_ANON,
        'Authorization': `Bearer ${SB_ANON}`,
        'Content-Type':  'application/json',
        'Prefer':        'return=minimal',
        ...extra
      },
      ...(body ? { body: JSON.stringify(body) } : {})
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(t);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function loadVendors() {
    document.getElementById('vendor-list').innerHTML = `
      <div class="loading"><div class="spin"></div><p>Loading vendors...</p></div>`;
    try {
      const data = await sb('vendors?select=*&order=submitted_at.desc.nullslast');
      allVendors = data || [];
      updateStats();
      applyFilters();
    } catch(err) {
      document.getElementById('vendor-list').innerHTML = `
        <div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><h3>Failed to load</h3><p>${err.message}</p></div>`;
    }
  }

  function updateStats() {
    const pending  = allVendors.filter(v => v.status === 'pending').length;
    const approved = allVendors.filter(v => v.status === 'approved').length;
    const rejected = allVendors.filter(v => v.status === 'rejected').length;
    document.getElementById('stat-pending').textContent  = pending;
    document.getElementById('stat-approved').textContent = approved;
    document.getElementById('stat-rejected').textContent = rejected;
    document.getElementById('stat-total').textContent    = allVendors.length;
  }

  function applyFilters() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const status = document.getElementById('status-filter').value;
    let list = allVendors.filter(v => {
      const matchStatus = status === 'all' || v.status === status;
      const matchSearch = !search ||
        (v.shop_name || '').toLowerCase().includes(search) ||
        (v.email || '').toLowerCase().includes(search) ||
        (v.shop_slug || '').toLowerCase().includes(search) ||
        (v.legal_name || '').toLowerCase().includes(search) ||
        (v.whatsapp || '').includes(search);
      return matchStatus && matchSearch;
    });
    renderVendors(list);
  }

  function renderVendors(list) {
    const el = document.getElementById('vendor-list');
    if (!list.length) {
      el.innerHTML = `<div class="empty"><i class="fa-solid fa-store-slash"></i><h3>No vendors found</h3><p>Try a different search or filter.</p></div>`;
      return;
    }
    el.innerHTML = list.map(v => vendorCard(v)).join('');
  }

  function vendorCard(v) {
    const name    = v.shop_name || v.legal_name || 'Unnamed vendor';
    const initial = name.charAt(0).toUpperCase();
    const slug    = v.shop_slug || '';
    const submitted = v.submitted_at ? new Date(v.submitted_at).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' }) : '—';
    const status  = v.status || 'draft';

    return `
    <div class="vendor-card status-${status}" id="vc-${v.uid}">
      <div class="vc-top">
        <div class="vc-avatar">
          ${v.shop_logo ? `<img src="${v.shop_logo}" alt="logo" onerror="this.style.display='none'" />` : initial}
        </div>
        <div class="vc-info">
          <div class="vc-name">${name}</div>
          <div class="vc-slug">mcstore.com.ng/shop/${slug}</div>
        </div>
        <div class="vc-status">
          <span class="pill pill-${status}">${status}</span>
        </div>
      </div>

      <div class="vc-details">
        <div class="vc-detail"><i class="fa-solid fa-envelope"></i>${v.email || '—'}</div>
        <div class="vc-detail"><i class="fa-brands fa-whatsapp"></i><span>${v.whatsapp || '—'}</span></div>
        <div class="vc-detail"><i class="fa-solid fa-location-dot"></i>${v.lga ? v.lga+', '+v.state : (v.state || '—')}</div>
        <div class="vc-detail"><i class="fa-solid fa-calendar"></i>Submitted: ${submitted}</div>
      </div>

      <button class="vc-toggle" onclick="toggleExpand('${v.uid}', this)">
        <i class="fa-solid fa-chevron-down"></i> View full details
      </button>

      <div class="vc-expanded" id="exp-${v.uid}">

        <div class="vc-section-title"><i class="fa-solid fa-store"></i> Shop Info</div>
        <div class="vc-info-grid">
          <div class="vc-info-item"><div class="i-label">Shop name</div><div class="i-val">${v.shop_name || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">Category</div><div class="i-val">${v.shop_category || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">URL slug</div><div class="i-val">${slug || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">Description</div><div class="i-val">${(v.shop_desc || '—').substring(0,80)}</div></div>
        </div>

        <div class="vc-section-title"><i class="fa-solid fa-briefcase"></i> Business Info</div>
        <div class="vc-info-grid">
          <div class="vc-info-item"><div class="i-label">Legal name</div><div class="i-val">${v.legal_name || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">NIN</div><div class="i-val">${v.nin || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">Business type</div><div class="i-val">${v.business_type || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">Address</div><div class="i-val">${v.address || '—'}</div></div>
        </div>

        <div class="vc-section-title"><i class="fa-solid fa-building-columns"></i> Payment</div>
        <div class="vc-info-grid">
          <div class="vc-info-item"><div class="i-label">Bank</div><div class="i-val">${v.bank_name || '—'}</div></div>
          <div class="vc-info-item"><div class="i-label">Account number</div><div class="i-val">${v.account_number || '—'}</div></div>
        </div>

        <div class="vc-section-title"><i class="fa-solid fa-id-badge"></i> Identity Documents</div>
        <div class="photo-row">
          ${v.id_photo_url ? `<div class="photo-wrap"><img class="photo-thumb" src="${v.id_photo_url}" alt="ID" onclick="openLightbox('${v.id_photo_url}')" /><div class="photo-label">ID Photo</div></div>` : '<span style="font-size:12px;color:var(--muted2);">No ID uploaded</span>'}
          ${v.selfie_url ? `<div class="photo-wrap"><img class="photo-thumb" src="${v.selfie_url}" alt="Selfie" onclick="openLightbox('${v.selfie_url}')" /><div class="photo-label">Selfie</div></div>` : ''}
          ${v.cac_url ? `<div class="photo-wrap"><img class="photo-thumb" src="${v.cac_url}" alt="CAC" onclick="openLightbox('${v.cac_url}')" /><div class="photo-label">CAC</div></div>` : ''}
        </div>

        ${v.rejection_reason ? `
        <div class="vc-section-title" style="color:var(--red);"><i class="fa-solid fa-circle-exclamation"></i> Previous Rejection Reason</div>
        <div style="background:var(--red-lt);border:1px solid var(--red-bd);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--red);font-weight:600;margin-bottom:10px;">${v.rejection_reason}</div>
        ` : ''}

        ${status === 'pending' || status === 'approved' || status === 'rejected' ? `
        <div class="rejection-wrap" id="rej-wrap-${v.uid}" style="${status === 'approved' ? 'display:none;' : ''}">
          <label>Rejection reason (required if rejecting)</label>
          <textarea id="rej-reason-${v.uid}" placeholder="Tell the vendor exactly what to fix so they can reapply successfully..."></textarea>
        </div>
        ` : ''}

        <div class="vc-actions">
          ${status !== 'approved' ? `
          <button class="btn-approve" onclick="approveVendor('${v.uid}')">
            <i class="fa-solid fa-circle-check"></i> Approve
          </button>` : `
          <button class="btn-reject" style="background:linear-gradient(135deg,var(--amber),#d97706);box-shadow:none;" onclick="revokeVendor('${v.uid}')">
            <i class="fa-solid fa-pause-circle"></i> Revoke approval
          </button>`}

          ${status !== 'rejected' ? `
          <button class="btn-reject" onclick="rejectVendor('${v.uid}')">
            <i class="fa-solid fa-circle-xmark"></i> Reject
          </button>` : `
          <button class="btn-approve" onclick="approveVendor('${v.uid}')">
            <i class="fa-solid fa-circle-check"></i> Approve
          </button>`}

          ${slug ? `
          <a href="https://mcstore.com.ng/shop/${slug}" target="_blank" rel="noopener" class="btn-view-shop">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>` : ''}
        </div>

      </div>
    </div>`;
  }

  function toggleExpand(uid, btn) {
    const exp = document.getElementById(`exp-${uid}`);
    const isOpen = exp.classList.contains('show');
    exp.classList.toggle('show', !isOpen);
    btn.innerHTML = isOpen
      ? '<i class="fa-solid fa-chevron-down"></i> View full details'
      : '<i class="fa-solid fa-chevron-up"></i> Collapse';
  }

  async function approveVendor(uid) {
    const btn = event.target.closest('button');
    btn.disabled = true;
    try {
      await fetch(`${SB_URL}/rest/v1/vendors?uid=eq.${uid}`, {
        method: 'PATCH',
        headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ status: 'approved', reviewed_at: new Date().toISOString(), rejection_reason: null })
      });
      showToast('Vendor approved successfully', 'success');
      await loadVendors();
    } catch(err) {
      showToast('Failed: ' + err.message, 'error');
      btn.disabled = false;
    }
  }

  async function rejectVendor(uid) {
    const reason = document.getElementById(`rej-reason-${uid}`)?.value?.trim();
    if (!reason) {
      showToast('Please enter a rejection reason first', 'error');
      document.getElementById(`rej-reason-${uid}`)?.focus();
      return;
    }
    const btn = event.target.closest('button');
    btn.disabled = true;
    try {
      await fetch(`${SB_URL}/rest/v1/vendors?uid=eq.${uid}`, {
        method: 'PATCH',
        headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ status: 'rejected', reviewed_at: new Date().toISOString(), rejection_reason: reason })
      });
      showToast('Vendor rejected — reason saved', 'success');
      await loadVendors();
    } catch(err) {
      showToast('Failed: ' + err.message, 'error');
      btn.disabled = false;
    }
  }

  async function revokeVendor(uid) {
    if (!confirm('Revoke this vendor\'s approval? Their dashboard access will be removed.')) return;
    const btn = event.target.closest('button');
    btn.disabled = true;
    try {
      await fetch(`${SB_URL}/rest/v1/vendors?uid=eq.${uid}`, {
        method: 'PATCH',
        headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ status: 'pending', reviewed_at: null })
      });
      showToast('Approval revoked', 'success');
      await loadVendors();
    } catch(err) {
      showToast('Failed: ' + err.message, 'error');
      btn.disabled = false;
    }
  }

  function openLightbox(url) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('show');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

  let toastTimer;
  function showToast(msg, type = 'success') {
    const t  = document.getElementById('toast');
    const m  = document.getElementById('toast-msg');
    const ic = t.querySelector('i');
    m.textContent = msg;
    t.className = `toast ${type} show`;
    ic.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Boot
  loadVendors();
</script>

</body>
</html>
